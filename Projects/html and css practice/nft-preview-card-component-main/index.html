<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="style.css">

    <title>Frontend Mentor | NFT preview card component</title>
  </head>
  <body>
    <div class="container">
      <div class="cards">
        <div class="image-container">

          <img class="image" src="/images/image-equilibrium.jpg"  alt="" />
          <img class="view" src="/images/icon-view.svg" alt="">
        </div>

        <h3>Equilibrium #3429</h3>
        <p>Our Equilibrium collection promotes balance and calm.</p>

        <div class="value">
          <div class="price">
            <img src="/images/icon-ethereum.svg" alt="" />
            <span>0.041 ETH</span>
          </div>

          <div class="days">
            <img src="/images/icon-clock.svg" alt="" />
            <p>3 days left</span>
          </div> 
          
        </div>
        <hr>
        <div id="author">
          <img src="/images/image-avatar.png" width="30 px" style="border: 2px solid white; border-radius: 50%;" height="auto" alt="">
          <p class="author-description">Creation of <span class="author-name"> Jules Wyvern</span></p>
          </div>


      </div>
    </div>

    <div class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
        >Frontend Mentor</a>. Coded by <a href="#">Your Name Here</a>.
    </div>
  </body>
</html>
