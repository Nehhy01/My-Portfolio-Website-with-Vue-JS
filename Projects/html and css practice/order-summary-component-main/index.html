<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />

    <title>Frontend Mentor | Order summary card</title>
  </head>
  <body>
    <div class="container">
      <img src="assets/images/illustration-hero.svg" class="hero" alt="" />
      <div class="cards">
        <h2 class="heading">Order Summary</h2>
        <p class="listen">
          You can now listen to millions of songs, audiobooks, and podcasts on
          any device anywhere you like!
        </p>

        <div class="plan">
          <div class="plan-b">
            <img
              src="assets/images/icon-music.svg"
              width="40px"
              height=""
              class="icon-music"
              alt=""
            />
            <div class="annual-plan">
              <p style="font-weight: 900">Annual Plan</p>
              <p>$59.99/year</p>
            </div>
          </div>
          <span> <a href="#">Change</a></span>
        </div>
        <button class="cta">Proceed to Payment</button>
        <button class="cta2">Cancel Order</button>
      </div>
    </div>
    <div class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
        >Frontend Mentor</a
      >. Coded by <a href="#">Ola Nehemiah</a>.
    </div>
  </body>
</html>
